<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/preferences.css" type="text/css"?>

<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsWindowLoad(window);"
>
  <script src="chrome://zotero/content/include.js" />
  <vbox flex="1">
    <groupbox>
      <label
        ><html:h2 data-l10n-id="gemini-pdf-settings-title"
          >Gemini API Settings</html:h2
        ></label
      >
      <hbox align="center">
        <label
          control="__addonRef__-gemini-api-key"
          data-l10n-id="gemini-pdf-api-key-label"
          >API Key:</label
        >
        <html:input
          type="text"
          id="__addonRef__-gemini-api-key"
          preference="__prefsPrefix__.geminiApiKey"
          flex="1"
        />
      </hbox>
      <hbox align="center">
        <label
          control="__addonRef__-gemini-system-prompt"
          data-l10n-id="gemini-pdf-system-prompt-label"
          >System Prompt:</label
        >
        <html:textarea
          id="__addonRef__-gemini-system-prompt"
          preference="__prefsPrefix__.geminiSystemPrompt"
          flex="1"
          rows="5"
        />
      </hbox>
      <hbox align="center">
        <label
          control="__addonRef__-prompt-for-selection"
          data-l10n-id="gemini-pdf-prompt-for-selection-label"
          >Prompt for Selection:</label
        >
        <html:textarea
          id="__addonRef__-prompt-for-selection"
          preference="__prefsPrefix__.promptForSelection"
          flex="1"
          rows="3"
        />
      </hbox>
      <hbox align="center">
        <label
          control="__addonRef__-gemini-model-list"
          data-l10n-id="gemini-pdf-model-list-label"
          >Available Models (comma-separated):</label
        >
        <html:textarea
          id="__addonRef__-gemini-model-list"
          preference="__prefsPrefix__.geminiModelList"
          flex="1"
          rows="2"
        />
      </hbox>
      <separator class="hr" />
      <hbox align="center">
        <label
          control="__addonRef__-title-generation-model"
          data-l10n-id="gemini-pdf-title-generation-model-label"
          >Title Generation Model:</label
        >
        <html:input
          type="text"
          id="__addonRef__-title-generation-model"
          preference="__prefsPrefix__.titleGenerationModel"
          flex="1"
        />
      </hbox>
      <hbox align="center">
        <label
          control="__addonRef__-title-generation-prompt"
          data-l10n-id="gemini-pdf-title-generation-prompt-label"
          >Title Generation Prompt:</label
        >
        <html:textarea
          id="__addonRef__-title-generation-prompt"
          preference="__prefsPrefix__.titleGenerationPrompt"
          flex="1"
          rows="4"
        />
      </hbox>
      <hbox align="center">
        <label
          control="__addonRef__-gemini-chat-history-limit"
          data-l10n-id="gemini-pdf-context-window-size-label"
          >Chat History Limit (messages):</label
        >
        <html:input
          type="number"
          id="__addonRef__-gemini-chat-history-limit"
          preference="__prefsPrefix__.contextWindowSize"
          flex="1"
          min="0"
          value="20"
        />
      </hbox>
    </groupbox>
  </vbox>
</vbox>
